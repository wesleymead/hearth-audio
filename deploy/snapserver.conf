[stream]
bind_to_address = 0.0.0.0
port = 1704
source = pipe:///run/hearth-audio/airplay.pcm?name=AirPlay&mode=read&sampleformat=48000:16:2&codec=flac&chunk_ms=26
source = pipe:///run/hearth-audio/soundboard.pcm?name=Soundboard&mode=read&sampleformat=48000:16:2&codec=flac&chunk_ms=26
default_source = AirPlay

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780
doc_root = /usr/share/snapserver/snapweb/

[tcp]
enabled = true
bind_to_address = 0.0.0.0
port = 1705

[streaming_client]
initial_volume = 100
